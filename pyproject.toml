[project]
name = "spellbook"
version = "0.3.0"
description = "Declarative Slurm experiment runner for Megatron-LM"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jinja2>=3.1.6",
    "matplotlib>=3.10",
    "numpy>=2.0",
    "pandas>=3.0.2",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "scipy>=1.15",
    "wandb>=0.27.0",
]

[tool.setuptools.packages.find]
include = ["spellbook*", "evals*", "tools*"]

[tool.setuptools.package-data]
evals = ["*.j2", "README.md"]
tools = ["README.md"]
"tools.inference" = ["*.j2", "README.md"]
"tools.merge" = ["*.j2", "README.md"]
"tools.gym_data" = ["*.j2", "README.md"]
"tools.conversion" = ["README.md"]
"spellbook.backends" = ["*.j2", "*.yaml"]
"spellbook.backends.slurm_megatron" = ["*.j2"]
"spellbook.backends.slurm_nemorl" = ["*.j2"]

[tool.ruff]
line-length = 100
extend-exclude = ["spellbook/backends/slurm_megatron/memory_estimator"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ty.src]
exclude = ["spellbook/backends/slurm_megatron/memory_estimator"]
