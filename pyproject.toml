[project]
name = "spellbook"
version = "0.2.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jinja2>=3.1.6",
    "pandas>=3.0.2",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "wandb>=0.27.0",
]

[tool.setuptools.packages.find]
include = ["spellbook*", "evals*"]

[tool.setuptools.package-data]
evals = ["*.j2", "README.md"]
"spellbook.backends.slurm_megatron" = ["*.j2"]

[tool.ruff]
extend-exclude = ["spellbook/backends/slurm_megatron/memory_estimator"]

[tool.ty.src]
exclude = ["spellbook/backends/slurm_megatron/memory_estimator"]
