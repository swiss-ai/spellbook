# Runtime preset template
# Copy this file and fill in the values for your specific Megatron + container version.
# Reference with: runtime="your-runtime-name" in ExperimentChain / Sweep.

# --- Container (Pyxis/Enroot) ---
container_edf: ""              # abs path to .toml EDF file

# --- Megatron-LM ---
megatron_path: ""              # abs path to Megatron-LM root (container workdir + PYTHONPATH)
megatron_patch_path: ""        # abs path to PAI-Megatron-patch (prepended to PYTHONPATH), or ""
mcore_release_version: ""      # informational tag, e.g. "mcore-0.12.0-te2.7"

# Optional: pin to a specific git commit (leave empty to use whatever is at the path)
megatron_commit: ""
megatron_patch_commit: ""
